name: Relógio

# Dispara a Coleta nos horários da decisão 0008 e atende o botão "Atualizar" do site
# (decisão 0018). Fica rodando ~5h45 e chama a si mesmo ao terminar; o cron abaixo só
# religa a corrente se ela se romper (um relógio novo sai na hora se já houver outro).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      continuacao:
        description: "Disparado pelo relógio anterior"
        default: "false"

permissions:
  actions: write
  contents: read

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Relógio
        env:
          DATABASE_URL: ${{ secrets.DATABASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m argus_pipeline.relogio ${{ inputs.continuacao == 'true' && '--continuacao' || '' }}
