name: Saúde do banco

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Prefixos de série separados por espaço (ex.: BR-079 BR-080); vazio = todas"
        required: false
        default: ""

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env:
          DATABASE_URL: ${{ secrets.DATABASE }}
          FILTRO: ${{ inputs.filtro }}
        run: uv run python -m argus_pipeline.health $FILTRO
