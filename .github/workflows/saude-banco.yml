name: Saúde do banco

on:
  workflow_dispatch:

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env:
          DATABASE_URL: ${{ secrets.DATABASE }}
        run: uv run python -m argus_pipeline.health
