name: Configurar site

# Cria o usuário só de leitura do site no Neon e grava DATABASE_URL na Vercel,
# gerando a senha aqui dentro (mascarada no log; ninguém precisa vê-la).
on:
  workflow_dispatch:

jobs:
  configurar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env:
          DATABASE_URL: ${{ secrets.DATABASE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: uv run python -m argus_pipeline.configurar_site
