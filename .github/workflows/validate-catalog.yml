name: Validar catálogo

on:
  workflow_dispatch:
    inputs:
      fases:
        description: "Fases a validar (separadas por espaço)"
        default: "MVP EUA"

permissions:
  contents: write

jobs:
  validate:
    name: Conferir códigos contra as fontes oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Diagnóstico de rede das fontes
        working-directory: .
        run: |
          for h in api.bcb.gov.br www3.bcb.gov.br dadosabertos.bcb.gov.br olinda.bcb.gov.br servicodados.ibge.gov.br; do
            echo "== $h"; getent hosts "$h" || echo "DNS falhou"
          done
          curl -sS -m 20 -o /dev/null -w "api.bcb.gov.br HTTP %{http_code}\n" "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados/ultimos/1?formato=json" || true
      - name: Gravar respostas reais (fixtures)
        run: uv run python -m argus_pipeline.validate.capture
      - name: Rodar validador
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python -m argus_pipeline.validate.run --fases ${{ inputs.fases }}
      - name: Gravar relatório no repositório
        run: |
          if grep -rEn "(api_key|apikey|token)=[A-Za-z0-9]{8,}" ../docs tests/fixtures 2>/dev/null; then
            echo "::error::possível chave de API nos arquivos; envio bloqueado" && exit 1
          fi
          git config user.name "argus-bot"
          git config user.email "argus-bot@users.noreply.github.com"
          git add ../docs/catalogo/validacao.md ../docs/catalogo/validacao.json tests/fixtures/real
          git diff --cached --quiet || git commit -m "Relatório de validação do catálogo"
          git pull --rebase -q && git push
