name: Sondar BCB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m argus_pipeline.probe_bcb
      - name: DNS alternativo (8.8.8.8) para api.bcb.gov.br
        run: |
          r=$(dig +short @8.8.8.8 api.bcb.gov.br | head -3 | tr '\n' ' ')
          echo "::notice::dig @8.8.8.8 api.bcb.gov.br: ${r:-sem resposta}"
          r=$(dig +short api.bcb.gov.br | head -3 | tr '\n' ' ')
          echo "::notice::dig (DNS do runner) api.bcb.gov.br: ${r:-sem resposta}"
      - name: Gravar amostras
        run: |
          if grep -rEn "(api_key|apikey|token)=[A-Za-z0-9]{8,}" tests/fixtures 2>/dev/null; then exit 1; fi
          git config user.name "argus-bot"
          git config user.email "argus-bot@users.noreply.github.com"
          git add tests/fixtures/real
          git diff --cached --quiet || git commit -m "Amostras reais do SGS (sondagem)"
          git pull --rebase -q && git push
