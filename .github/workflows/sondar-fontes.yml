name: Sondar fontes

on:
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: uv run python -m argus_pipeline.probe_fontes
