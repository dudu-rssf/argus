name: Sondar fontes

on:
  workflow_dispatch:
    inputs:
      sgs_candidatos:
        description: "Códigos SGS para testar (separados por espaço)"
        default: ""
      so_sgs:
        description: "Testar só os códigos SGS (1 = sim)"
        default: ""

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SGS_CANDIDATOS: ${{ inputs.sgs_candidatos }}
          SO_SGS: ${{ inputs.so_sgs }}
        run: uv run python -m argus_pipeline.probe_fontes
