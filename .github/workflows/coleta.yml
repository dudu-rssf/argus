name: Coleta

on:
  # Os horários (decisão 0008) são disparados pelo workflow "Relógio" (decisão 0018):
  # o agendamento do próprio GitHub atrasava horas e pulava execuções.
  workflow_dispatch:
    inputs:
      gatilho:
        description: "Origem da execução"
        default: manual
        type: choice
        options: [manual, botao, agenda]
      fontes:
        description: "Limitar a fontes (ex.: 'sgs focus'); vazio = todas"
        default: ""

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar séries do MVP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GATILHO: ${{ inputs.gatilho || 'agenda' }}
          FONTES: ${{ inputs.fontes }}
        run: uv run python -m argus_pipeline.collect --gatilho "$GATILHO" ${FONTES:+--fontes $FONTES}
