name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline-tests:
    name: Testes do pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: argus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/argus_test
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q -rs
      - name: Configuração gerada está em dia com o catálogo
        run: |
          uv run python -m argus_pipeline.catalog
          git diff --exit-code -- ../config/series || (echo "::error::config/series desatualizado: rode 'uv run python -m argus_pipeline.catalog' e commite" && exit 1)
