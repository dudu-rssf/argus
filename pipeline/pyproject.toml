[project]
name = "argus-pipeline"
version = "0.1.0"
description = "Coleta, validação e carga de dados do Argus"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
